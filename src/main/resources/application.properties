spring.application.name=barberbooking
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql

notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080}
notification.timeout-ms=${NOTIFICATION_TIMEOUT_MS:2000}
notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
notification.retry-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:250}
