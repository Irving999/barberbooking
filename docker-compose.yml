services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barberbooking}
      POSTGRES_USER: ${POSTGRES_USER:-barberbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberbooking}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-barberbooking}
      DB_USER: ${POSTGRES_USER:-barberbooking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-barberbooking}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
